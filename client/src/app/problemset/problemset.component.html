<section class="home">
  <h1>Problems</h1>
  @if (loading()) {
    <p class="info">Loading...</p>
  }
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
  <div class="list">
    @for (p of problems(); track p.name) {
      <div class="card" (click)="openProblem(p.name)">
        <div class="header">
          <span class="name">{{ p.name }}</span>
        </div>
        <p class="statement">
          {{ p.statement }}
        </p>
      </div>
    }
  </div>
</section>
