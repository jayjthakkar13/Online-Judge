<div class="page">
  <section class="left">
    <div class="header">
      <h1>{{ title() }}</h1>
      <button (click)="viewSubmissions()">View Submissions</button>
    </div>
    <div class="body">
      <p>{{ statement() }}</p>
    </div>
  </section>

  <section class="right">
    <div class="editor">
      <div class="topbar">
        <span>Code</span>
        <select
          [value]="language()"
          (change)="setLanguage($any($event.target).value)">
          <option value="c">C</option>
          <option value="cpp">C++</option>
          <option value="py">Python</option>
        </select>
      </div>

      <div class="editor-body">
        <ngx-codemirror
          [ngModel]="code()"
          (ngModelChange)="code.set($event)"
          [options]="editorOptions()">
        </ngx-codemirror>
      </div>
    </div>

    <div class="io">
      <div class="tabs">
        <button (click)="tab.set('input')" [class.active]="tab() === 'input'">Input</button>
        <button (click)="tab.set('output')" [class.active]="tab() === 'output'">Output</button>
      </div>

      <div class="io-body">
        @if(tab() === 'input') {
          <textarea
            [value]="input()"
            (input)="input.set($any($event.target).value)"
            placeholder="Enter input here...">
          </textarea>
        } @else {
          @if(showResult()) {
            <pre>{{ output() }}</pre>
          } @else {
            <div>Run code to see output</div>
          }
        }
      </div>
    </div>

    <div class="actions">
      <button class="run" (click)="runCode()" [disabled]="running()">
        Run
      </button>
      <button class="submit" (click)="submitCode()" [disabled]="running()">
        Submit
      </button>
    </div>
  </section>
</div>
